server:
  servlet:
    context-path: /investai-api

spring:
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15m
  mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: ${MAIL_SMTP_AUTH:false}
            starttls:
              enable: ${MAIL_SMTP_STARTTLS_ENABLE :false}

app:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@investai.com}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

hgbrasil:
  api-key: ${HG_BRASIL_API_KEY:}
  base-url: ${HG_BRASIL_BASE_URL:https://api.hgbrasil.com}
  mock-enabled: ${HGBRASIL_MOCK_ENABLED:false}
  cache:
    refresh-rate-ms: 900000 # 15 minutos

tesourodireto:
  base-url: ${TESOURO_DIRETO_BASE_URL:https://brapi.dev/api/v2/treasury}
  mock-enabled: ${TESOURO_DIRETO_MOCK_ENABLED:false}
  sync:
    cron: ${TESOURO_DIRETO_SYNC_CRON:0 0,30 10-18 * * MON-FRI}

ia:
  timeout-segundos: ${IA_TIMEOUT_SEGUNDOS:20}

bcb:
  base-url: ${BCB_BASE_URL:https://api.bcb.gov.br}

mercado:
  sync:
    cron: ${MERCADO_SYNC_CRON:0 */15 10-18 * * MON-FRI}
  selic-ipca:
    sync:
      cron: ${SELIC_IPCA_SYNC_CRON:0 0 7 * * *}

security:
  reset-token-expiration-minutes: 30

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-days: 7