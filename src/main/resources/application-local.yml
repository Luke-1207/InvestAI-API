server:
  servlet:
    context-path: /investai-api

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investai_db}
    username: ${SPRING_DATASOURCE_USERNAME:investaidb_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:investaidb_dev123!@#}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15m
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:local}
    password: ${MAIL_PASSWORD:local}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE :false}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: no-reply@investai.com
  frontend-url: http://localhost:4200

hgbrasil:
  api-key: chave-local-placeholder
  base-url: https://api.hgbrasil.com
  mock-enabled: true
  cache:
    refresh-rate-ms: 900000 # 15 minutos

tesourodireto:
  base-url: https://brapi.dev/api/v2/treasury
  mock-enabled: true
  sync:
    cron: "0 0,30 10-18 * * MON-FRI"

ia:
  timeout-segundos: ${IA_TIMEOUT_SEGUNDOS:20}

bcb:
  base-url: https://api.bcb.gov.br

mercado:
  sync:
    cron: "0 */15 10-18 * * MON-FRI"
  selic-ipca:
    sync:
      cron: "0 0 7 * * *"

jwt:
  secret: ${JWT_SECRET:investai-local-dev-secret-super-segura-256bits}
  expiration-ms: 900000
  refresh-expiration-days: 7